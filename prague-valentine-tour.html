<style>
:root{
  --navy:#0b1f3a;--navy-2:#132d52;--coral:#e8604c;--coral-dark:#c94a37;--gold:#d4a24c;
  --sand:#faf6ef;--ink:#1d2433;--muted:#667085;--line:#e7e1d6;--white:#ffffff;--ok:#1f9d6b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Manrope','Tajawal',system-ui,sans-serif;background:var(--sand);color:var(--ink);line-height:1.7;font-size:16px}
html[lang=ar] body{font-family:'Tajawal','Manrope',system-ui,sans-serif}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* Header */
header.top{position:sticky;top:0;z-index:50;background:#f2f2f2;border-bottom:1px solid #e2e2e2;box-shadow:0 2px 12px rgba(0,0,0,.06)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:12px}
.brand{display:flex;align-items:center;text-decoration:none}
.brand img{height:50px;width:auto;object-fit:contain}
.hdr-right{display:flex;align-items:center;gap:12px}
.langs{display:flex;background:#fff;border:1px solid #ddd;border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;font:700 13px 'Manrope','Tajawal',sans-serif;color:var(--navy);padding:5px 11px;border-radius:999px;cursor:pointer}
.langs button.on{background:var(--navy);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--coral);color:#fff;border:0;border-radius:999px;padding:11px 22px;font:700 15px inherit;font-family:inherit;cursor:pointer;text-decoration:none;transition:background .2s,transform .2s}
.btn:hover{background:var(--coral-dark);transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.5)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
@media(max-width:560px){header.top .hdr-right .btn{display:none}.brand img{height:42px}}

/* Hero */
.hero{position:relative;color:#fff;overflow:hidden;padding:90px 0 70px;background:var(--navy)}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,31,58,.50) 0%,rgba(11,31,58,.92) 100%)}
.hero .wrap{position:relative;z-index:1}
.hero .tag{display:inline-block;background:rgba(212,162,76,.18);border:1px solid rgba(212,162,76,.6);color:#f3d89d;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:700;margin-bottom:18px}
.hero h1{font-size:clamp(32px,6vw,56px);font-weight:800;line-height:1.2;margin-bottom:14px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .cities{color:#f3d89d;font-weight:700;font-size:15px;margin-bottom:12px}
.hero .lead{max-width:640px;font-size:17px;opacity:.92;margin-bottom:22px}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
.badge{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);padding:7px 13px;border-radius:10px;font-size:14px;font-weight:600}
.badge svg{width:16px;height:16px;stroke:#f3d89d}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px}

/* Sections */
section.blk{padding:72px 0 10px}
.eyebrow{display:block;text-align:center;color:var(--coral);font-weight:700;font-size:14px;letter-spacing:.04em;margin-bottom:8px}
h2.ttl{text-align:center;color:var(--navy);font-size:clamp(26px,4vw,38px);font-weight:800;line-height:1.25;margin-bottom:10px}
.sub{text-align:center;color:var(--muted);margin:0 auto 34px;max-width:640px}

/* Mosaic */
.mosaic{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:190px 190px;gap:10px}
.mosaic figure{position:relative;border-radius:14px;overflow:hidden;cursor:zoom-in;background:#ddd}
.mosaic figure:first-child{grid-row:1 / span 2}
.mosaic img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.mosaic figure:hover img{transform:scale(1.04)}
.mosaic figcaption{position:absolute;inset:auto 0 0 0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-weight:700;font-size:14px}
@media(max-width:720px){.mosaic{grid-template-columns:1fr 1fr;grid-template-rows:220px 140px 140px}.mosaic figure:first-child{grid-column:1 / span 2;grid-row:auto}}

/* Included */
.incl{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.inc{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.inc .ic{flex:none;width:46px;height:46px;border-radius:10px;background:#fdece8;display:grid;place-items:center}
.inc svg{width:22px;height:22px;stroke:var(--coral)}
.inc b{color:var(--navy);font-size:16px;line-height:1.35}
@media(max-width:860px){.incl{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.incl{grid-template-columns:1fr}}

.band{margin-top:26px;background:var(--navy);color:#fff;border-radius:16px;padding:26px 30px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.band h3{font-size:22px;font-weight:800;margin-bottom:2px}
.band p{opacity:.88}

/* Days */
.days{display:flex;flex-direction:column;gap:18px}
.day{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.day .banner{height:190px;background-size:cover;background-position:center;cursor:zoom-in}
.day .head{display:flex;align-items:center;gap:16px;padding:18px 22px;cursor:pointer;user-select:none}
.dnum{flex:none;width:58px;height:58px;border-radius:10px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.dnum small{font-size:11px;opacity:.85}
.dnum b{font-size:22px}
.dmeta{flex:1;min-width:0}
.dmeta .theme{color:var(--coral);font-weight:700;font-size:14px}
.dmeta h3{color:var(--navy);font-size:20px;font-weight:800;line-height:1.3}
.dmeta .date{color:var(--muted);font-size:13px;font-weight:600}
.ovn{flex:none;background:#e6f5ee;color:var(--ok);font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px}
.chev{flex:none;width:22px;height:22px;stroke:var(--navy);transition:transform .25s}
.day.open .chev{transform:rotate(180deg)}
.body{display:none;padding:4px 22px 20px}
.day.open .body{display:block}
.stop{position:relative;display:grid;grid-template-columns:1fr 128px;gap:18px;padding:14px 0 22px;padding-inline-start:26px}
.stop::before{content:"";position:absolute;inset-inline-start:6px;top:28px;bottom:-14px;width:2px;background:var(--line)}
.stop:last-child::before{display:none}
.stop::after{content:"";position:absolute;inset-inline-start:0;top:18px;width:10px;height:10px;border-radius:50%;border:3px solid var(--coral);background:#fff}
.slot{color:var(--muted);font-weight:700;font-size:13px}
.stop h4{color:var(--navy);font-size:17px;font-weight:800;margin:4px 0 6px}
.stop p{color:#475066;font-size:15px}
.stop .story{margin-top:8px;background:#fdf6e9;border-inline-start:3px solid var(--gold);padding:8px 12px;border-radius:6px;font-size:14px;color:#6b5320}
.stop img{width:128px;height:92px;object-fit:cover;border-radius:10px;cursor:zoom-in}
@media(max-width:600px){.day .head{flex-wrap:wrap;padding:16px}.ovn{order:3;margin-inline-start:74px}.stop{grid-template-columns:1fr}.stop img{width:100%;height:170px;order:-1}.body{padding:4px 16px 16px}}

/* Notes */
.notes{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 24px;color:#475066;font-size:15px}
.notes ul{padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}

/* Form */
.formcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;max-width:620px;margin:0 auto;box-shadow:0 10px 30px rgba(11,31,58,.06)}
.fld{margin-bottom:16px}
.fld label{display:block;font-weight:700;color:var(--navy);font-size:14px;margin-bottom:6px}
.fld input,.fld select{width:100%;border:1.5px solid #d9d4ca;border-radius:10px;padding:12px 14px;font:500 16px inherit;font-family:inherit;background:#fffdf9;color:var(--ink)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--coral)}
.fld.bad input{border-color:#d64545}
.fld .err{display:none;color:#d64545;font-size:13px;margin-top:4px}
.fld.bad .err{display:block}
.formcard .btn{width:100%;padding:14px}
.msg{margin-top:14px;font-weight:600;font-size:15px;display:none}
.msg.ok{display:block;color:var(--ok)}
.msg.bad{display:block;color:#d64545}
.formcard{position:relative}.hp{position:absolute;top:0;inset-inline-start:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* Credits + footer */
.credits{margin-top:60px;font-size:13px;color:var(--muted)}
.credits summary{cursor:pointer;font-weight:700;color:var(--navy)}
.credits ul{margin-top:10px;padding-inline-start:18px;columns:2;column-gap:28px}
.credits a{color:var(--muted)}
@media(max-width:600px){.credits ul{columns:1}}
footer{margin-top:50px;background:var(--navy);color:#fff;padding:36px 0 100px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:center}
footer .fbrand{font-weight:800;font-size:18px}
footer .fbrand small{display:block;font-weight:500;opacity:.75;font-size:14px}
footer .links{display:flex;flex-wrap:wrap;gap:16px;font-weight:600;font-size:15px}
footer .links a{text-decoration:none;opacity:.9;direction:ltr;unicode-bidi:isolate}
footer .links a:hover{opacity:1;text-decoration:underline}

/* WhatsApp float + sticky bar */
.wa{position:fixed;bottom:22px;inset-inline-end:22px;z-index:60;display:flex;align-items:center;gap:10px;text-decoration:none}
.wa .lbl{background:#fff;color:var(--ink);font-weight:700;font-size:14px;padding:8px 14px;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.wa .dot{width:56px;height:56px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(37,211,102,.18)}
.wa svg{width:30px;height:30px;fill:#fff}
.stick{position:fixed;inset:auto 0 0 0;z-index:55;background:var(--navy);color:#fff;display:none;align-items:center;justify-content:space-between;padding:10px 16px calc(10px + env(safe-area-inset-bottom));gap:10px}
.stick b{font-size:15px}
.stick .btn{padding:9px 18px;font-size:14px}
@media(max-width:720px){.wa .lbl{display:none}.wa{bottom:78px}.stick{display:flex}}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(5,12,25,.92);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.lb.on{display:flex}
.lb img{max-height:82vh;max-width:96vw;border-radius:10px}
.lb p{color:#fff;margin-top:12px;font-weight:600;text-align:center}
.lb button{position:absolute;top:16px;inset-inline-end:18px;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:26px;width:44px;height:44px;border-radius:50%;cursor:pointer}
</style>
</head>

let L='ar';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chev='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

function render(lang){
  L=lang; const t=T[lang];
  document.documentElement.lang=lang; document.documentElement.dir=t.dir; document.title=t.title;
  document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t[e.dataset.t]});
  document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  $('#h1').innerHTML=t.h1;
  $('#badges').innerHTML=t.badges.map(([i,s])=>'<span class="badge">'+svg(i)+esc(s)+'</span>').join('');
  $('#mosaic').innerHTML=t.hl.map(([k,c],i)=>'<figure data-k="'+k+'" data-c="'+esc(c)+'"><img loading="lazy" src="'+src(k,i?960:1280)+'" alt="'+esc(c)+'"><figcaption>'+esc(c)+'</figcaption></figure>').join('');
  $('#incl').innerHTML=t.inc.map(([i,s])=>'<div class="inc"><span class="ic">'+svg(i)+'</span><b>'+esc(s)+'</b></div>').join('');
  const open=[...document.querySelectorAll('.day.open')].map(d=>+d.dataset.i);
  $('#days').innerHTML=t.days.map((d,i)=>'<article class="day'+((open.length?open.includes(i):i===0)?' open':'')+'" data-i="'+i+'">'+
    '<div class="banner" data-k="'+d.banner+'" data-c="'+esc(d.title)+'" style="background-image:url(\''+src(d.banner)+'\')"></div>'+
    '<div class="head"><div class="dnum"><small>'+t.day+'</small><b>'+(i+1)+'</b></div><div class="dmeta"><div class="theme">'+esc(d.theme)+'</div><h3>'+esc(d.title)+'</h3><div class="date">'+esc(d.date)+'</div></div><span class="ovn">'+(d.last?t.ovnLast:t.ovn)+'</span>'+chev+'</div>'+
    '<div class="body">'+d.stops.map(([s,h,p,k])=>{const story=s===T[lang].days[0].stops[2][0]||s===T[lang].days[3].stops[2][0];return '<div class="stop"><div><div class="slot">'+esc(s)+'</div><h4>'+esc(h)+'</h4>'+(story?'<p class="story">'+esc(p)+'</p>':'<p>'+esc(p)+'</p>')+'</div><img loading="lazy" src="'+src(k,500)+'" data-k="'+k+'" data-c="'+esc(h)+'" alt="'+esc(h)+'"></div>'}).join('')+'</div></article>').join('');
  $('#notes').innerHTML=t.notes.map(n=>'<li>'+esc(n)+'</li>').join('');
  const sel=$('#i-pax'),v=sel.selectedIndex; sel.innerHTML=t.pax.map(p=>'<option>'+esc(p)+'</option>').join(''); sel.selectedIndex=Math.max(0,v);
  $('#credits').innerHTML=Object.keys(IMG).map(k=>'<li><a href="'+page(k)+'" target="_blank" rel="noopener">'+decodeURIComponent(IMG[k].split('/')[2]).replace(/_/g,' ')+'</a></li>').join('');
  const wa='https://wa.me/'+WA+'?text='+encodeURIComponent(t.waMsg);
  $('#waFloat').href=wa; $('#waFoot').href=wa;
  try{localStorage.setItem('mjLang',lang)}catch(e){}
  const u=new URL(location.href); if(u.searchParams.get('lang')!==lang){u.searchParams.set('lang',lang);try{history.replaceState(null,'',u)}catch(e){}}
}

document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>render(b.dataset.l));
$('#days').addEventListener('click',e=>{
  const z=e.target.closest('[data-k]'); if(z){lightbox(z.dataset.k,z.dataset.c);return}
  const h=e.target.closest('.head'); if(h) h.parentElement.classList.toggle('open');
});
$('#mosaic').addEventListener('click',e=>{const f=e.target.closest('figure');if(f)lightbox(f.dataset.k,f.dataset.c)});
function lightbox(k,c){const lb=$('#lb');lb.querySelector('img').src=src(k);lb.querySelector('p').textContent=c;lb.classList.add('on')}
$('#lb').onclick=e=>{if(e.target.tagName!=='IMG')$('#lb').classList.remove('on')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#lb').classList.remove('on')});

$('#form').addEventListener('submit',async e=>{
  e.preventDefault(); const t=T[L];
  const name=$('#i-name').value.trim(),phone=$('#i-phone').value.trim(),email=$('#i-email').value.trim();
  const bad=(id,b)=>{$('#'+id).classList.toggle('bad',b);return !b};
  let ok=bad('f-name',name.length<3); ok=bad('f-phone',phone.replace(/[^\d]/g,'').length<8)&&ok; ok=bad('f-email',!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))&&ok;
  if(!ok||$('#honey').value) return;
  const btn=$('#send'),msg=$('#msg'); btn.disabled=true; btn.textContent=t.sending; msg.className='msg';
  try{
    const res=await fetch('https://formsubmit.co/ajax/'+RECEIVER_EMAIL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({_subject:'تسجيل اهتمام جديد – '+TRIP_NAME,_template:'table','الرحلة':TRIP_NAME,'الاسم':name,'الهاتف':phone,'البريد الإلكتروني':email,'عدد المسافرين':$('#i-pax').value,'اللغة':L.toUpperCase()})});
    if(!res.ok) throw new Error();
    $('#form').reset(); msg.className='msg ok'; msg.textContent=t.ok(name);
  }catch(err){msg.className='msg bad'; msg.textContent=t.fail}
  btn.disabled=false; btn.textContent=t.send;
});

let init='ar';
try{const q=new URL(location.href).searchParams.get('lang');const s=localStorage.getItem('mjLang');init=T[q]?q:(T[s]?s:'ar')}catch(e){}
render(init);
$('#heroBg').style.backgroundImage="url('"+src('hero',1920)+"')";
</script>
